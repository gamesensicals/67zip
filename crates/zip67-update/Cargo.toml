[package]
name = "zip67-update"
description = "Signed update checks and downloads for 67zip"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
minisign-verify = "0.3.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
ureq = { version = "3.5.2", default-features = false, features = ["rustls", "platform-verifier"] }
zip67-core = { version = "0.1.1", path = "../zip67-core" }

[dev-dependencies]
minisign = "0.10.0"
minisign-verify = "0.3.0"
sha2 = "0.11.1"
tempfile = "3.27.0"
