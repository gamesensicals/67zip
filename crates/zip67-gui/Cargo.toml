[package]
name = "zip67-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[package.metadata.deb]
name = "67zip"
maintainer = "67zip contributors"
copyright = "2026, 67zip contributors"
license-file = ["../../LICENSE", "0"]
extended-description = "Fast and secure archive manager: 7z, zip, tar (gz, bz2, xz, zst, lz) and more. The archive engine is written in safe Rust and runs sandboxed."
section = "utils"
priority = "optional"
depends = "$auto, libxkbcommon-x11-0"
assets = [
    ["target/release/67zip", "usr/bin/", "755"],
    ["target/release/67z", "usr/bin/", "755"],
    ["../../data/io.github.gamesensicals.SixtySevenZip.desktop", "usr/share/applications/", "644"],
    ["../../data/io.github.gamesensicals.SixtySevenZip.metainfo.xml", "usr/share/metainfo/", "644"],
    ["../../data/icons/io.github.gamesensicals.SixtySevenZip.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["../../data/kio/67zip-servicemenu.desktop", "usr/share/kio/servicemenus/", "755"],
    ["../../data/kio/67zip-extract-servicemenu.desktop", "usr/share/kio/servicemenus/", "755"],
    ["../../data/nemo/67zip-extract-here.nemo_action", "usr/share/nemo/actions/", "644"],
    ["../../data/nemo/67zip-add.nemo_action", "usr/share/nemo/actions/", "644"],
    ["../../data/nemo/67zip-add-password.nemo_action", "usr/share/nemo/actions/", "644"],
]

[[bin]]
name = "67zip"
path = "src/main.rs"

[dependencies]
iced = { version = "0.14.0", features = ["svg", "tokio", "advanced", "image"] }
jiff = "1.0.2"
mundy = { version = "0.2.3", default-features = false, features = ["async-io", "color-scheme", "accent-color"] }
rfd = "0.17.2"
rustix = { version = "1.1.6", features = ["process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
zip67-core = { version = "0.1.1", path = "../zip67-core" }
zip67-update = { version = "0.1.1", path = "../zip67-update" }
zip67-worker = { version = "0.1.1", path = "../zip67-worker" }
