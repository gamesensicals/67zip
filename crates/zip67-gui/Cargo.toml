[package]
name = "zip67-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "67zip"
path = "src/main.rs"

[dependencies]
iced = { version = "0.14.0", features = ["svg", "tokio", "advanced", "image"] }
jiff = "1.0.2"
mundy = { version = "0.2.3", default-features = false, features = ["async-io", "color-scheme", "accent-color"] }
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
zip67-core = { version = "0.1.0", path = "../zip67-core" }
zip67-worker = { version = "0.1.0", path = "../zip67-worker" }
