[package]
name = "zip67-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
aes = "0.9.2"
blake3 = "1.8.7"
bzip2 = "0.6.1"
cap-std = "4.0.3"
cbc = "0.2.1"
crc32fast = "1.5.5"
ctr = "0.10.1"
flate2 = { version = "1.1.11", default-features = false, features = ["zlib-rs"] }
getrandom = "0.4.3"
hmac = "0.13.0"
lzma-rust2 = { version = "0.25.0", default-features = false, features = ["std", "encoder", "xz", "lzip"] }
md-5 = "0.11.0"
miniz_oxide = "0.9.1"
pbkdf2 = "0.13.0"
ppmd-rust = "1.5.2"
ruzstd = "0.9.1"
serde = { version = "1.0.229", features = ["derive"] }
sha1 = "0.11.0"
sha2 = "0.11.1"
zeroize = "1.9.2"

[dev-dependencies]
tempfile = "3.27.0"
