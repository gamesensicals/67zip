[package]
name = "zip67-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "67z"
path = "src/main.rs"

[dependencies]
ctrlc = "3.5.3"
rustix = { version = "1.1.6", features = ["termios", "stdio"] }
zip67-core = { version = "0.1.1", path = "../zip67-core" }
zip67-update = { version = "0.1.1", path = "../zip67-update" }
zip67-worker = { version = "0.1.1", path = "../zip67-worker" }

[dev-dependencies]
tempfile = "3.27.0"
