[workspace]
resolver = "3"
members = ["crates/zip67-core", "crates/zip67-cli", "crates/zip67-gui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/gamesensicals/67zip"
rust-version = "1.88"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
overflow-checks = true
panic = "unwind"
strip = "symbols"

[profile.dev.package."*"]
opt-level = 2
