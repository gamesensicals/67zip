name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: System packages (7-Zip for compatibility tests)
        run: sudo apt-get update && sudo apt-get install -y 7zip libxkbcommon-x11-0
      - name: Build
        run: cargo build --workspace --locked
      - name: Tests (includes 7-Zip compatibility and attack tests)
        run: cargo test --workspace --locked
      - name: Sandbox self-test
        run: cargo run --locked -p zip67-cli -- --sandbox-selftest "$RUNNER_TEMP"
      - name: Clippy
        run: cargo clippy --workspace --locked -- -D clippy::correctness -D clippy::suspicious

  appimage:
    # An AppImage runs on distros with the same or newer glibc than the
    # build machine, so build on an older Ubuntu for wider reach.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build AppImage
        run: ./packaging/appimage/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: 67zip-x86_64.AppImage
          path: target/appimage/67zip-x86_64.AppImage
          if-no-files-found: error

  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  fuzz:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz --locked
      - name: Fuzz every parser for a short while
        run: |
          cd fuzz
          for t in $(cargo fuzz list); do
            # Work on a copy so new inputs never land in the committed seeds.
            mkdir -p corpus && cp -r "seeds/$t" "corpus/$t"
            # detect_leaks=0: LeakSanitizer reports glibc's per-thread
            # bookkeeping of short-lived decoder threads as a 32-byte leak.
            # Real runaway memory is still caught by -rss_limit_mb.
            cargo fuzz run "$t" "corpus/$t" -- -max_total_time=60 -rss_limit_mb=2048 -timeout=20 -detect_leaks=0
          done
