name: Release

# Pushing a tag like v0.1.1 builds the AppImage and the .deb, writes the
# signed update manifest (latest.json) that 67zip checks for updates, and
# publishes everything as a GitHub release.
#
# Needs two repository secrets (Settings > Secrets and variables > Actions):
#   MINISIGN_SECRET_KEY  the contents of the minisign secret key file
#   MINISIGN_PASSWORD    its password (empty if the key has none)
# The signatures are checked against the key built into 67zip
# (data/67zip-update.pub) before anything is published.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    # Build on an older Ubuntu so the AppImage runs on more distros.
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Check the tag matches the version
        run: |
          v="${GITHUB_REF_NAME#v}"
          grep -q "^version = \"$v\"$" Cargo.toml || { echo "Tag $GITHUB_REF_NAME doesn't match the version in Cargo.toml"; exit 1; }
          grep -q "^## $v " CHANGELOG.md || { echo "CHANGELOG.md has no section for $v"; exit 1; }

      - name: Check the signing secrets are there
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: '[ -n "$MINISIGN_SECRET_KEY" ] || { echo "The MINISIGN_SECRET_KEY secret is missing"; exit 1; }'

      - name: Tests
        run: sudo apt-get update && sudo apt-get install -y 7zip libxkbcommon-x11-0 && cargo test --workspace --locked

      - name: Build the AppImage
        run: ./packaging/appimage/build.sh

      - name: Build the .deb
        run: cargo install cargo-deb --locked && cargo deb -p zip67-gui --no-build

      - name: Collect the packages
        run: |
          v="${GITHUB_REF_NAME#v}"
          mkdir dist
          cp target/appimage/67zip-x86_64.AppImage "dist/67zip-$v-x86_64.AppImage"
          cp target/debian/*.deb "dist/67zip_${v}_amd64.deb"
          cargo build --release --locked -p zip67-update --example release
          R=target/release/examples/release
          $R manifest "$v" "$GITHUB_REF_NAME" CHANGELOG.md \
            "dist/67zip-$v-x86_64.AppImage=appimage-x86_64" \
            "dist/67zip_${v}_amd64.deb=deb-x86_64" > dist/latest.json
          $R notes "$v" CHANGELOG.md > notes.md
          (cd dist && sha256sum * > SHA256SUMS)

      - name: Sign
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          set -eu
          umask 077
          key="$(mktemp)"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key"
          target/release/examples/release sign "$key" dist/*

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            cat notes.md
            echo
            echo "Every file is signed with the 67zip release key (minisign, key ID 269FF0C6C87BEF0F, see data/67zip-update.pub):"
            echo '`minisign -Vm <file> -P RWQP73vIxvCfJvPJDeYUb598zfVDB0vMJkxUFcLDvZHUHdQflwNXcLyM`'
          } > release-notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --title "67zip ${GITHUB_REF_NAME#v}" --notes-file release-notes.md --verify-tag
